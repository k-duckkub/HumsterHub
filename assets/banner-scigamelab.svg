<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f7fbfb"/>
      <stop offset="100%" stop-color="#e8f4f4"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a2b"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- soft blobs -->
  <circle cx="705" cy="80" r="120" fill="#2c9fa2" opacity="0.07"/>
  <circle cx="120" cy="400" r="140" fill="#ff6b00" opacity="0.06"/>

  <!-- subject tags -->
  <g font-family="'Noto Sans Thai', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <g transform="translate(452,34)">
      <rect x="0" y="0" width="112" height="34" rx="10" fill="#2c9fa2"/>
      <text x="56" y="23" fill="#ffffff">PHYSICS</text>
    </g>
    <g transform="translate(576,26)">
      <rect x="0" y="0" width="132" height="34" rx="10" fill="#ff6b00"/>
      <text x="66" y="23" fill="#ffffff">CHEMISTRY</text>
    </g>
    <g transform="translate(600,72)">
      <rect x="0" y="0" width="112" height="34" rx="10" fill="#2c9fa2"/>
      <text x="56" y="23" fill="#ffffff">BIOLOGY</text>
    </g>
  </g>

  <!-- headline -->
  <text x="44" y="118" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" fill="#0a1a2f" letter-spacing="-1">SciGame</text>
  <text x="44" y="186" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" fill="#2c9fa2" letter-spacing="-1">Lab</text>
  <text x="186" y="186" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" fill="#ff6b00" letter-spacing="-1">Camp</text>

  <!-- thai tagline -->
  <g font-family="'Noto Sans Thai', Arial, sans-serif" font-size="27" font-weight="700">
    <text x="46" y="240" fill="#0a1a2f">เปลี่ยน<tspan fill="#2c9fa2">วิทย์</tspan>ที่เคยยาก</text>
    <text x="46" y="282" fill="#0a1a2f">ให้กลายเป็น<tspan fill="#ff6b00">เกมสุดเจ๋ง</tspan></text>
  </g>

  <!-- portfolio pill -->
  <g transform="translate(42,304)">
    <rect x="0" y="0" width="316" height="42" rx="21" fill="#f4e9dd"/>
    <text x="158" y="28" font-family="'Noto Sans Thai', Arial, sans-serif" font-size="16" fill="#0a1a2f" text-anchor="middle">ผลงาน 0% พัฒนาเป็น Portfolio</text>
  </g>

  <!-- lab flask centrepiece -->
  <g transform="translate(430,150)">
    <rect x="34" y="0" width="26" height="30" rx="5" fill="#cfe3e3"/>
    <path d="M28 30 L14 92 Q47 116 80 92 L66 30 Z" fill="#ffd8a8" stroke="#e8a13a" stroke-width="3"/>
    <path d="M22 62 Q47 78 72 62 L80 92 Q47 116 14 92 Z" fill="#ff9e2c"/>
    <circle cx="38" cy="80" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="56" cy="88" r="3.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- atom -->
  <g transform="translate(392,84)" opacity="0.9">
    <circle cx="0" cy="0" r="5" fill="#ff6b00"/>
    <ellipse cx="0" cy="0" rx="27" ry="10" fill="none" stroke="#2c9fa2" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="27" ry="10" fill="none" stroke="#2c9fa2" stroke-width="3" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="27" ry="10" fill="none" stroke="#2c9fa2" stroke-width="3" transform="rotate(120)"/>
  </g>

  <!-- voxel ground -->
  <g transform="translate(392,286)">
    <path d="M0 30 L60 0 L120 30 L60 60 Z" fill="#7ac74f"/>
    <path d="M0 30 L60 60 L60 92 L0 62 Z" fill="#6b4a2f"/>
    <path d="M120 30 L60 60 L60 92 L120 62 Z" fill="#8a5f3d"/>
  </g>

  <!-- hamster mascot -->
  <g transform="translate(430,236)">
    <circle cx="30" cy="30" r="27" fill="#d9a273"/>
    <circle cx="11" cy="11" r="9" fill="#d9a273"/>
    <circle cx="49" cy="11" r="9" fill="#d9a273"/>
    <circle cx="11" cy="11" r="4" fill="#efc59b"/>
    <circle cx="49" cy="11" r="4" fill="#efc59b"/>
    <ellipse cx="19" cy="36" rx="7" ry="5.4" fill="#fdf3e7"/>
    <ellipse cx="41" cy="36" rx="7" ry="5.4" fill="#fdf3e7"/>
    <circle cx="21" cy="26" r="3.4" fill="#0a1a2f"/>
    <circle cx="39" cy="26" r="3.4" fill="#0a1a2f"/>
    <ellipse cx="30" cy="35" rx="2.6" ry="2" fill="#0a1a2f"/>
  </g>

  <!-- monitor with code -->
  <g transform="translate(300,296)">
    <rect x="0" y="0" width="104" height="72" rx="7" fill="#0a1a2f"/>
    <rect x="7" y="8" width="42" height="5" rx="2.5" fill="#7ac74f"/>
    <rect x="7" y="21" width="66" height="5" rx="2.5" fill="#2c9fa2"/>
    <rect x="7" y="34" width="52" height="5" rx="2.5" fill="#ff9e2c"/>
    <rect x="7" y="47" width="72" height="5" rx="2.5" fill="#4b5a6b"/>
    <rect x="40" y="72" width="24" height="10" fill="#0a1a2f"/>
    <rect x="26" y="82" width="52" height="6" rx="3" fill="#0a1a2f"/>
  </g>

  <!-- tablet with chart -->
  <g transform="translate(596,258)">
    <rect x="0" y="0" width="86" height="112" rx="9" fill="#0a1a2f"/>
    <rect x="9" y="12" width="68" height="66" rx="4" fill="#12263f"/>
    <rect x="17" y="56" width="11" height="16" fill="#2c9fa2"/>
    <rect x="33" y="44" width="11" height="28" fill="#ff9e2c"/>
    <rect x="49" y="34" width="11" height="38" fill="#7ac74f"/>
    <circle cx="43" cy="94" r="6" fill="#31465e"/>
  </g>

  <!-- gamepad -->
  <g transform="translate(210,360)">
    <rect x="0" y="10" width="86" height="44" rx="20" fill="#3d4a5c"/>
    <circle cx="20" cy="32" r="5" fill="#cbd5e0"/>
    <circle cx="64" cy="26" r="4" fill="#ff6b00"/>
    <circle cx="72" cy="36" r="4" fill="#2c9fa2"/>
  </g>

  <!-- CTA -->
  <g transform="translate(524,384)">
    <rect x="0" y="0" width="234" height="46" rx="23" fill="url(#cta)"/>
    <text x="98" y="31" font-family="'Noto Sans Thai', Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">สมัครเลย!</text>
    <path d="M182 23 H206 M198 15 L206 23 L198 31" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
